scenarios:
  database-availability:
    pluginId: adaptiflow.database-availability
    enabled: true
    intervalMs: 5000
    events:
      - id: database-available
        type: ConditionalEvent
        collector:
          type: ResourceUsageCollector
        evaluators:
          - type: IncreaseResourceUsageEvaluator
            parameters:
              constructorArgTypes:
                - tools.spirals.cerberus237.adaptiflow.interfaces.ThresholdProvider
                - tools.spirals.cerberus237.adaptiflow.interfaces.ThresholdProvider
              constructorArgs:
                - 75.0
                - 80.0
        actions:
          - type: RestAdaptationAction
            parameters:
              constructorArgTypes:
                - java.util.List
                - java.lang.String
                - java.lang.String
              constructorArgs:
                - [DatabaseAvailableEventBroadcast]
                - http://image:8080/tools.descartes.teastore.image/rest/adapt
                - EnableExternalImageProvider
      - id: database-unavailable
        type: ConditionalEvent
        collector:
          type: ResourceUsageCollector
        evaluators:
          - type: DecreaseResourceUsageEvaluator
            parameters:
              constructorArgTypes:
                - tools.spirals.cerberus237.adaptiflow.interfaces.ThresholdProvider
                - tools.spirals.cerberus237.adaptiflow.interfaces.ThresholdProvider
              constructorArgs:
                - 60.0
                - 60.0
        actions:
          - type: RestAdaptationAction
            parameters:
              constructorArgTypes:
                - java.util.List
                - java.lang.String
                - java.lang.String
              constructorArgs:
                - [DatabaseUnavailableEventBroadcast]
                - http://image:8080/tools.descartes.teastore.image/rest/adapt
                - DisableExternalImageProvider
          - type: DockerActionFactory
            parameters:
              factoryMethod: unpauseContainer
              factoryArgTypes:
                - java.lang.String
              factoryArgs:
                - adaptable_teastore_db
