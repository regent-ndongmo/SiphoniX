<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; max-width: 800px; font-family: system-ui, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke" />
        </marker>
    </defs>
    
    <style>
        .flow-path {
            fill: none;
            stroke-width: 2;
            stroke-dasharray: 6 6;
            animation: flow 1.5s linear infinite;
        }

        @keyframes flow {
            to {
                stroke-dashoffset: -12;
            }
        }

        .box-shadow {
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.05));
        }

        text {
            fill: #0f2647;
        }
    </style>

    <text x="320" y="25" text-anchor="middle" font-size="16" font-weight="700">Autonomic Manager for a Java Microservice</text>

    <g class="box-shadow">
        <rect x="20" y="50" width="600" height="310" rx="15" fill="#e8f0fc" stroke="#2563b0" stroke-width="2" />
        <text x="320" y="70" text-anchor="middle" font-size="12" font-weight="700">Deployment Unit (container / pod)</text>
    </g>

    <g class="box-shadow">
        <rect x="60" y="90" width="230" height="230" rx="12" fill="#ffffff" stroke="#2563b0" stroke-width="2" />
        <text x="175" y="110" text-anchor="middle" font-size="11" font-weight="700">Java Microservice</text>
        <text x="175" y="125" text-anchor="middle" font-size="10" fill="#6b7fa3">(Managed System)</text>

        <rect x="80" y="140" width="190" height="60" rx="8" fill="#e03c2f" fill-opacity="0.1" stroke="#e03c2f" stroke-width="1.5" />
        <text x="175" y="165" text-anchor="middle" font-size="10" font-weight="600">Business Components / Logic</text>

        <rect x="80" y="210" width="190" height="40" rx="8" fill="#2bc0b4" fill-opacity="0.1" stroke="#2bc0b4" stroke-width="1.5" />
        <text x="175" y="235" text-anchor="middle" font-size="10" font-weight="600">Metrics Collectors</text>

        <rect x="80" y="260" width="190" height="40" rx="8" fill="#f0a500" fill-opacity="0.1" stroke="#f0a500" stroke-width="1.5" />
        <text x="175" y="285" text-anchor="middle" font-size="10" font-weight="600">Adaptation Actions</text>
    </g>

    <g class="box-shadow">
        <rect x="350" y="90" width="230" height="230" rx="12" fill="#ffffff" stroke="#9b5de5" stroke-width="2" />
        <text x="465" y="110" text-anchor="middle" font-size="11" font-weight="700">Autonomic Manager</text>
        <text x="465" y="125" text-anchor="middle" font-size="10" fill="#6b7fa3">(MAPE-K Controller)</text>

        <circle cx="465" cy="180" r="35" fill="#9b5de5" fill-opacity="0.1" stroke="#9b5de5" stroke-width="1.5" />
        <text x="465" y="184" text-anchor="middle" font-size="10" font-weight="600">Self-Adaptive</text>
        <text x="465" y="196" text-anchor="middle" font-size="10" font-weight="600">Logic</text>

        <rect x="370" y="220" width="190" height="40" rx="8" fill="#2563b0" fill-opacity="0.1" stroke="#2563b0" stroke-width="1.5" />
        <text x="465" y="245" text-anchor="middle" font-size="10" font-weight="600">REST Client</text>

        <rect x="370" y="270" width="190" height="40" rx="8" fill="#9b5de5" fill-opacity="0.1" stroke="#9b5de5" stroke-width="1.5" />
        <text x="465" y="295" text-anchor="middle" font-size="10" font-weight="600">CLI Interface (Wrapper)</text>
    </g>

    <path d="M 270 230 C 310 230, 310 240, 370 240" class="flow-path" stroke="#2bc0b4" marker-end="url(#arrow)" fill="none" />
    
    <path d="M 270 240 C 310 240, 310 280, 370 280" class="flow-path" stroke="#2bc0b4" stroke-dasharray="4 4" marker-end="url(#arrow)" fill="none" />
    
    <path d="M 370 250 C 310 250, 310 280, 270 280" class="flow-path" stroke="#f0a500" marker-end="url(#arrow)" fill="none" />
    
    <path d="M 370 300 C 330 300, 330 290, 270 290" class="flow-path" stroke="#f0a500" stroke-dasharray="4 4" marker-end="url(#arrow)" fill="none" />

    <g transform="translate(20, 375)" class="box-shadow">
        <rect x="0" y="0" width="600" height="65" rx="8" fill="#ffffff" stroke="#e8f0fc" stroke-width="2" />

        <text x="20" y="20" font-size="10" font-weight="700">Legend:</text>

        <rect x="150" y="10" width="10" height="10" rx="2" fill="#2563b0" fill-opacity="0.1" stroke="#2563b0" stroke-width="1.5" />
        <text x="165" y="19" font-size="10">REST API channel</text>

        <rect x="150" y="30" width="10" height="10" rx="2" fill="#9b5de5" fill-opacity="0.1" stroke="#9b5de5" stroke-width="1.5" />
        <text x="165" y="39" font-size="10">CLI Interface channel</text>

        <line x1="380" y1="15" x2="410" y2="15" stroke="#2bc0b4" stroke-width="2" marker-end="url(#arrow)" />
        <text x="420" y="19" font-size="10">Metrics Collection (REST/CLI)</text>

        <line x1="380" y1="35" x2="410" y2="35" stroke="#f0a500" stroke-width="2" marker-end="url(#arrow)" />
        <text x="420" y="39" font-size="10">Adaptation Action (REST/CLI)</text>
    </g>
</svg>
