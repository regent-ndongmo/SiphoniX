scenarios:
  cache-size:
    pluginId: adaptiflow.cache-size
    enabled: true
    intervalMs: 5000
    events:
      - id: cache-entries
        type: ConditionalEvent
        collector:
          type: RestMetricsCollector
          parameters:
            constructorArgTypes:
              - java.lang.String
              - java.lang.String
              - java.lang.String
              - java.lang.Class
            constructorArgs:
              - http://image:8080/tools.descartes.teastore.image/rest
              - /metrics/cache-entries
              - GET
              - java.util.List
        evaluators:
          - type: TrueEvaluator
        subscribers:
          - type: EventSubscriber
            actions:
              - type: RestAdaptationAction
                parameters:
                  constructorArgTypes:
                    - java.util.List
                    - java.lang.String
                    - java.lang.String
                  constructorArgs:
                    - [CacheEntriesObservation]
                    - http://image:8080/tools.descartes.teastore.image/rest/adapt
                    - CacheEntriesObservation
